<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crud Operation</title>
    <link rel="stylesheet" href="css/all.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/master.css" />
  </head>
  <body>
  
    

    <div class="container customm mt-4">
      
      <form class="">
        <label class="">Product Name</label>
        <input id="pName" type="text" class="form-control mb-3" placeholder="Product Name">
        <label class="">Product Price</label>
        <input id="pPrice" type="number" class="form-control mb-3" placeholder="Product Price">
        <label class="">Product Ctegory</label>
        <select name="category" id="pCategory" class="form-select mb-3">
          <option value="Tv">Tv</option>
          <option value="Labtop">Labtop</option>
          <option value="Phone">Phone</option>
        </select>
        <div class="mb-3">
          <label class="form-label">Product Description</label>
          <textarea class="form-control" id="pDesc"></textarea>
        </div>

        <button type="button" class="btn btn-outline-primary" id="btnAdd">Add Product</button>
        <button type="button" class="btn btn-outline-primary d-none" id="btnUpdate">Update Product</button>
        <button type="button" class="btn btn-outline-danger" id="btnclear">Clear Form</button>

      </form>
      <input id="pSearch" type="text" class="form-control my-3 w-50 mx-auto" placeholder="Search By Name Or Category">
      <table class="table table-striped table-hover table-bordered text-center text-capitalize mt-4">
        <thead>
          <tr>
            <th scope="col">index</th>
            <th scope="col">Product Name</th>
            <th scope="col">Product Price</th>
            <th scope="col">Product Category</th>
            <th scope="col">Product Description</th>
            <th scope="col">Update</th>
            <th scope="col">Delete</th>
            <!-- <th scope="col"><button class="btn btn-warning">Update</button></th>
            <th scope="col"><button class="btn btn-danger">Delete</button></th> -->
          </tr>
        </thead>
        <tbody id="tbody">
    

        </tbody>
      </table>

    </div>



    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
