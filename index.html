<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="css/all.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/master.css" />
  </head>
  <body class="auth-bg">
    <div class="overlay"></div>

    <div
      class="container d-flex justify-content-center align-items-center vh-100"
    >
      <div class="auth-card p-5 bg-white bg-opacity-75">
        <div class="text-center mb-4">
          <h2 class="fw-bold">Welcome Back</h2>
          <p class="text-muted">Login to continue</p>
        </div>

        <form id="loginForm">
          <div class="mb-4">
            <input
              type="email"
              id="loginEmail"
              class="form-control custom-input"
              placeholder="Email"
              required
            />
          </div>

          <div class="mb-4">
            <input
              type="password"
              id="loginPassword"
              class="form-control custom-input"
              placeholder="Password"
              required
            />
          </div>

          <p id="loginMessage" class="alert alert-danger d-none"></p>

          <button type="submit" class="btn custom-btn w-100">Login</button>
        </form>

        <div class="text-center mt-4">
          <small
            >Don't have an account?
            <a href="register.html" class="fw-semibold text-decoration-none"
              >Register</a
            >
          </small>
        </div>
      </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
